services:
  rehydra:
    image: rehydra-relay:0.11.0-hardened
    build:
      context: ../..
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8787:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
