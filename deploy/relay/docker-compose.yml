services:
  rehydra:
    image: rehydra-relay:0.11.0-hardened
    build:
      context: ../..
    restart: unless-stopped
    # Run as the host user that owns ./audit so the bind-mounted audit log is
    # writable (image default uid 999 cannot write the host-owned dir).
    user: "1000:1000"
    env_file:
      - .env
    ports:
      - "8787:8787"
    # Override the image CMD to append --audit-log. Audit records include the
    # original un-anonymized bodies; the file persists on the host volume below.
    # The upstream URL comes from REHYDRA_UPSTREAM in .env (never committed).
    command:
      - node
      - dist/cli/bin.js
      - proxy
      - auto
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --ner
      - disabled
      - --types
      - API_KEY
      - --secrets
      - --quiet
      - --audit-log
      - /data/audit.jsonl
      - --audit-compress
    volumes:
      - ./audit:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
